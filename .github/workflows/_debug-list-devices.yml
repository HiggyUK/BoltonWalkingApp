name: Debug List Simulator Devices

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: macos-26
    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: List iPhone device types
        run: xcrun simctl list devicetypes | grep -i iphone
