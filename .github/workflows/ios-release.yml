name: iOS Release Build & Upload

# Manual trigger only - run from the Actions tab when you're ready to ship a build to TestFlight/App Store.
on:
  workflow_dispatch:

env:
  PROJECT_PATH: BoltonWalking.App/BoltonWalking.App.csproj
  # Must exactly match the certificate's Common Name and the provisioning profile's Name.
  CODESIGN_KEY: "Apple Distribution: JOHN CAMPBELL-HIGGENS (96V2528QR6)"
  CODESIGN_PROVISION: "BWOAS App Store"

jobs:
  build-and-upload:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls -d /Applications/Xcode*.app

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MAUI/iOS workloads
        run: dotnet workload restore ${{ env.PROJECT_PATH }}

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed 's/"//g')

      - name: Import distribution certificate
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Install provisioning profile
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/"$UUID".mobileprovision

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8

      - name: Publish signed IPA
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="${{ env.CODESIGN_KEY }}" \
            -p:CodesignProvision="${{ env.CODESIGN_PROVISION }}" \
            -p:CodesignTeamId="${{ secrets.IOS_TEAM_ID }}"

      - name: Locate IPA
        id: locate_ipa
        run: |
          IPA_PATH=$(find BoltonWalking.App/bin/Release/net10.0-ios -name "*.ipa" | head -1)
          echo "IPA at: $IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoltonWalkingApp-ios-ipa
          path: ${{ steps.locate_ipa.outputs.ipa_path }}

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "${{ steps.locate_ipa.outputs.ipa_path }}" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain build.keychain || true
