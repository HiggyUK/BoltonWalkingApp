name: iOS App Store Screenshots

# Manual trigger only - captures screenshots on the iOS Simulator at Apple's
# required App Store sizes (6.9" iPhone and 13" iPad, since this app supports
# both device families). Downloads as a workflow artifact for manual upload
# in App Store Connect.
on:
  workflow_dispatch:

env:
  PROJECT_PATH: BoltonWalking.App/BoltonWalking.App.csproj
  BUNDLE_ID: com.boltonwalking.app

jobs:
  capture-screenshots:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore MAUI/iOS workloads
        run: dotnet workload restore ${{ env.PROJECT_PATH }}

      - name: Build for iOS Simulator
        run: |
          dotnet build "${{ env.PROJECT_PATH }}" \
            -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=iossimulator-arm64

      - name: Locate .app bundle
        id: locate_app
        run: |
          APP_PATH=$(find BoltonWalking.App/bin/Release/net10.0-ios -maxdepth 2 -name "*.app" -type d | head -1)
          echo "App at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Find newest iPhone Pro Max and iPad Pro 13-inch device types
        id: device_types
        run: |
          IPHONE_TYPE=$(xcrun simctl list devicetypes -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin)['devicetypes']; names=[x['identifier'] for x in d if 'iPhone' in x['name'] and 'Pro-Max' in x['identifier']]; print(sorted(names)[-1])" 2>/dev/null || true)
          IPAD_TYPE=$(xcrun simctl list devicetypes -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin)['devicetypes']; names=[x['identifier'] for x in d if 'iPad-Pro' in x['identifier'] and '13' in x['identifier']]; print(sorted(names)[-1])" 2>/dev/null || true)
          # App Store Connect's iPhone screenshot slot for this app currently
          # asks for the older 6.5" class (1242x2688 / 1284x2778), not the
          # 6.9" one above - try known 6.5" models newest-first.
          # NOTE: iPhone 14/15 Pro Max are 1290x2796 (Dynamic Island redesign
          # changed the point size) - NOT an accepted size. Only 12/13 Pro Max
          # (1284x2778) and 11 Pro Max / Xs Max (1242x2688) match.
          IPHONE65_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; ids={x['identifier'] for x in json.load(sys.stdin)['devicetypes']}; names=['iPhone-13-Pro-Max','iPhone-12-Pro-Max','iPhone-11-Pro-Max','iPhone-XS-Max']; matches=['com.apple.CoreSimulator.SimDeviceType.'+n for n in names]; found=[m for m in matches if m in ids]; print(found[0] if found else '')" 2>/dev/null || true)
          echo "iPhone device type: $IPHONE_TYPE"
          echo "iPad device type: $IPAD_TYPE"
          echo "iPhone 6.5-inch device type: $IPHONE65_TYPE"
          echo "iphone_type=$IPHONE_TYPE" >> "$GITHUB_OUTPUT"
          echo "ipad_type=$IPAD_TYPE" >> "$GITHUB_OUTPUT"
          echo "iphone65_type=$IPHONE65_TYPE" >> "$GITHUB_OUTPUT"

      - name: Find newest iOS runtime
        id: runtime
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin)['runtimes']; ios=[x['identifier'] for x in d if x['name'].startswith('iOS')]; print(sorted(ios)[-1])")
          echo "Runtime: $RUNTIME"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"

      - name: Capture screenshots on a simulator
        env:
          APP_PATH: ${{ steps.locate_app.outputs.app_path }}
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          mkdir -p screenshots
          # Each value is set as BWOAS_SCREENSHOT_ROUTE in the app's process env
          # (via simctl's SIMCTL_CHILD_ prefix) - App.xaml.cs reads it on launch
          # and navigates there. RouteDetailsPage has no tab of its own, so the
          # app resolves it to the first route returned by IRoutesService.
          ROUTES="AboutPage BookPage RoutesPage MorePage CommitteePage FaqPage SafetyGuidePage DifficultyGuidePage RouteDetailsPage"

          for PAIR in "iphone:${{ steps.device_types.outputs.iphone_type }}" "ipad:${{ steps.device_types.outputs.ipad_type }}" "iphone65:${{ steps.device_types.outputs.iphone65_type }}"; do
            LABEL="${PAIR%%:*}"
            DEVICE_TYPE="${PAIR#*:}"
            if [ -z "$DEVICE_TYPE" ]; then
              echo "::warning::No matching device type found for $LABEL, skipping"
              continue
            fi
            UDID=$(xcrun simctl create "screenshot-$LABEL" "$DEVICE_TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP_PATH"
            # Pre-grant location so the OS permission prompt never covers the Routes/route-detail map
            xcrun simctl privacy "$UDID" grant location "${{ env.BUNDLE_ID }}"

            for ROUTE in $ROUTES; do
              SIMCTL_CHILD_BWOAS_SCREENSHOT_ROUTE="$ROUTE" \
                xcrun simctl launch --terminate-running-process "$UDID" "${{ env.BUNDLE_ID }}"
              sleep 8
              # RouteDetailsPage additionally waits on a route list fetch before navigating
              if [ "$ROUTE" = "RouteDetailsPage" ]; then sleep 5; fi
              xcrun simctl io "$UDID" screenshot "screenshots/$LABEL-$ROUTE.png"
            done

            xcrun simctl shutdown "$UDID"
            xcrun simctl delete "$UDID"
          done
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-store-screenshots
          path: screenshots/*.png
